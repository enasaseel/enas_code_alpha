<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phishing Awareness Training</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1c2430;--mu:#5b6677;--ac:#1f6feb;--bd:#dde3ec;--bad:#c62828;--ok:#2e7d32;--wn:#fff4e5}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--tx:#e8edf4;--mu:#9aa6b8;--ac:#58a6ff;--bd:#2b3646;--bad:#ff7b72;--ok:#56d364;--wn:#2a2216}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:18px}#prog{color:var(--mu);font-size:14px}
main{max-width:820px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px}
h2{margin-top:0}li{margin:6px 0}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.box{border:1px solid var(--bd);border-radius:10px;padding:12px}.box b{color:var(--ac)}
.mail{border:1px solid var(--bd);border-radius:8px;padding:14px;background:var(--wn);font-size:14px}
.mail u{text-decoration:underline wavy var(--bad)}.flag{color:var(--bad);font-weight:600}
code{background:var(--bg);padding:1px 6px;border-radius:5px;word-break:break-all}
nav{display:flex;justify-content:space-between;margin-top:16px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:8px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;margin:8px 0}.opt.right{border-color:var(--ok);color:var(--ok)}.opt.wrong{border-color:var(--bad);color:var(--bad)}
.ex{margin-top:10px;padding:10px;border-left:4px solid var(--ac);background:var(--bg)}
</style></head><body>
<header><b>🎣 Phishing Awareness Training</b><span id="prog"></span></header>
<main><div class="card" id="view"></div>
<nav><button id="prev">← Back</button><button id="next" class="p">Next →</button></nav>
<p class="mu" style="font-size:13px">CodeAlpha Cyber Security Internship – Task 2. All sample names and links are fictional.</p></main>
<script>
const slides=[
{t:"1. What is phishing?",h:`<p>Phishing is a <b>social-engineering attack</b>: criminals pretend to be a trusted person or company to trick you into clicking a link, opening a file, or giving away passwords, card numbers or money.</p>
<ul><li>Over 90% of successful cyber attacks start with a human mistake, most often a malicious message.</li><li>It targets <b>people</b>, not technology, so firewalls alone cannot stop it.</li><li>Goals: steal credentials, install malware/ransomware, commit payment fraud.</li></ul>`},
{t:"2. Types of phishing",h:`<div class="grid">
<div class="box"><b>Email phishing</b><br>Mass emails pretending to be banks, delivery firms, IT.</div>
<div class="box"><b>Spear phishing</b><br>Personalised for one victim using their name, job or colleagues.</div>
<div class="box"><b>Whaling</b><br>Aimed at executives; often "urgent wire transfer" requests.</div>
<div class="box"><b>Smishing</b><br>Fake SMS: "Your parcel is held, pay a fee".</div>
<div class="box"><b>Vishing</b><br>Phone calls from a fake "bank" or "tech support".</div>
<div class="box"><b>Clone / fake sites</b><br>Look-alike login pages that capture what you type.</div></div>`},
{t:"3. Spot a phishing email",h:`<div class="mail"><b>From:</b> <u>support@paypa1-secure.example</u><br><b>Subject:</b> <u>URGENT: Account suspended in 24 hours!</u><br><br>Dear <u>Customer</u>,<br>We noticed <u>unusual activity</u>. Verify now or your account will be closed:<br><u>http://paypa1-secure.example/login</u><br><br><u>Attachment: invoice_2026.zip</u></div>
<p><span class="flag">Red flags:</span></p><ul>
<li><b>Sender domain</b> is a look-alike (<code>paypa1</code> with a number 1).</li>
<li><b>Urgency and threats</b> to stop you from thinking.</li>
<li><b>Generic greeting</b> ("Dear Customer") instead of your name.</li>
<li><b>Suspicious link:</b> hover before clicking; it is not the real domain and uses plain <code>http</code>.</li>
<li><b>Unexpected attachment</b> (zip, exe, macro-enabled Office file).</li>
<li>Spelling/grammar mistakes and requests for passwords or card data.</li></ul>`},
{t:"4. Fake websites",h:`<p>Always read the <b>real domain</b>: it is the part right before the first single <code>/</code> and after the last dot of the host.</p>
<ul><li><code>paypa1.com</code> – digit "1" instead of "l"</li><li><code>secure-login.bank.example.net</code> – real domain is <b>example.net</b>, "bank" is just a subdomain</li><li><code>bank-example.com</code> – extra hyphen/word added</li><li><code>examp1e.com</code> or <code>exаmple.com</code> – look-alike or lookalike Unicode characters</li></ul>
<p><b>Checks:</b> type the address yourself or use a bookmark; the padlock only means the connection is encrypted, <u>not</u> that the site is honest; be careful with shortened links (bit.ly) and QR codes ("quishing").</p>`},
{t:"5. Social-engineering tactics",h:`<div class="grid">
<div class="box"><b>Urgency</b><br>"Act within 1 hour!"</div><div class="box"><b>Fear</b><br>"Your account was hacked."</div>
<div class="box"><b>Authority</b><br>"This is the CEO / IT department / police."</div><div class="box"><b>Greed</b><br>"You won a prize / refund."</div>
<div class="box"><b>Curiosity</b><br>"See who viewed your profile."</div><div class="box"><b>Helpfulness / trust</b><br>"Can you quickly help me with a gift card?"</div></div>
<p><b>Rule:</b> when a message pushes emotion + speed, <b>stop and verify</b> through a second channel.</p>`},
{t:"6. Real-world examples",h:`<ul>
<li><b>RSA breach (2011):</b> staff opened an Excel file in a phishing email called "2011 Recruitment plan"; attackers got into the security company's systems.</li>
<li><b>Google & Facebook invoice scam (2013–2015):</b> a fraudster posed as a hardware supplier and sent fake invoices, collecting over $100 million.</li>
<li><b>John Podesta email (2016):</b> a fake "Google security alert" led him to a look-alike login page and thousands of emails were stolen.</li>
<li><b>Twitter hack (2020):</b> attackers phoned employees pretending to be IT, got credentials and took over famous accounts.</li></ul>
<p class="mu">Lesson: even tech experts are fooled, so habits and verification matter more than intelligence.</p>`},
{t:"7. Best practices",h:`<ul>
<li><b>Pause</b> on any urgent message; verify via a known phone number or the official app.</li>
<li><b>Hover</b> over links; never log in from an email link.</li>
<li>Use a <b>password manager</b> (it won't autofill on fake domains) and unique passwords.</li>
<li>Enable <b>multi-factor authentication</b>, ideally with an app or security key.</li>
<li>Never open unexpected attachments; keep OS, browser and antivirus updated.</li>
<li><b>Never share</b> passwords, OTP codes or PINs: no real company asks for them.</li>
<li><b>Report</b> suspicious messages to IT/security and delete them.</li></ul>
<div class="ex"><b>If you clicked:</b> disconnect from the network, change the password from a clean device, enable MFA, tell IT/your bank immediately, and scan for malware.</div>`}
];
const quiz=[
{q:"You get an email from 'it-helpdesk@c0mpany.example' asking you to reset your password within 1 hour. What do you do?",o:["Click the link quickly","Reply with your old password","Ignore the link and contact IT through a known channel","Forward it to colleagues"],a:2,e:"The domain uses a zero and the message creates urgency. Verify through an official channel."},
{q:"Which URL is most likely the real PayPal site?",o:["paypal.com.security-check.example","paypa1.com","www.paypal.com","paypal-login.example"],a:2,e:"The real domain is the part before the first single slash, here 'paypal.com'. The others are tricks."},
{q:"The padlock icon in the browser means:",o:["The site is safe and trustworthy","The connection is encrypted, but the site could still be fake","The site was verified by the government","No malware is present"],a:1,e:"Criminals also get HTTPS certificates. The padlock only shows encryption."},
{q:"Your 'CEO' emails asking you to urgently buy gift cards and keep it secret. This is probably:",o:["A normal request","Whaling / business email compromise","A system update","A spam newsletter"],a:1,e:"Authority + secrecy + urgency is a classic social-engineering pattern. Confirm by phone."},
{q:"A caller says they're from your bank and asks for the SMS code just sent to you. You should:",o:["Give the code to prove your identity","Hang up and call the number on your card","Give half of the code","Ask them to email it"],a:1,e:"One-time codes must never be shared. Hang up and call the official number yourself."},
{q:"You clicked a suspicious link and entered your password. First step?",o:["Do nothing","Change the password on a clean device, enable MFA and report it","Restart the computer only","Delete the email only"],a:1,e:"Act fast: change credentials, enable MFA, and alert IT or your bank."}
];
let i=0,qi=0,score=0,done=false;const v=document.getElementById("view"),total=slides.length+1;
function render(){document.getElementById("prog").textContent=`Step ${i+1} / ${total}`;
document.getElementById("prev").disabled=i==0;document.getElementById("next").style.display=i>=total-1?"none":"";
if(i<slides.length){v.innerHTML=`<h2>${slides[i].t}</h2>${slides[i].h}`}else showQ()}
function showQ(){if(qi>=quiz.length){const p=Math.round(score/quiz.length*100);
v.innerHTML=`<h2>Quiz result: ${score}/${quiz.length} (${p}%)</h2><p>${p>=80?"🎉 Excellent! You can spot most phishing attempts.":"Review the slides and try again."}</p><button class="p" onclick="qi=0;score=0;showQ()">Retry quiz</button>`;return}
const q=quiz[qi];v.innerHTML=`<h2>8. Quiz – question ${qi+1} of ${quiz.length}</h2><p>${q.q}</p>`+
q.o.map((o,k)=>`<button class="opt" onclick="ans(${k},this)">${o}</button>`).join("")+`<div id="fb"></div>`}
function ans(k,b){const q=quiz[qi];document.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j==q.a)x.classList.add("right")});
if(k==q.a)score++;else b.classList.add("wrong");
document.getElementById("fb").innerHTML=`<div class="ex">${k==q.a?"✅ Correct. ":"❌ Not quite. "}${q.e}</div><p><button class="p" onclick="qi++;showQ()">${qi==quiz.length-1?"See result":"Next question"}</button></p>`}
document.getElementById("next").onclick=()=>{if(i<total-1){i++;render()}};
document.getElementById("prev").onclick=()=>{if(i>0){i--;render()}};
render();
</script></body></html>
